name: CI

# Merge gate. Runs on every pull request and on pushes to main, and mirrors what
# AGENTS.md calls the quality gates: the Go backend builds, vets, is gofmt-clean and passes
# its tests (no network), and the front end's tests and production build run.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The build must not depend on a tidy being run afterwards.
      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # No test touches the network; every source is a fixture.
      - name: Test
        run: go test ./... -count=1

      # The three budgeted hot paths, run so a regression fails the gate rather than a release.
      - name: Benchmarks
        run: |
          go test ./internal/rules/ -bench . -run XXX
          go test ./internal/llm/ -bench . -run XXX
          go test ./internal/store/ -bench . -run XXX

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Cache vite
        uses: actions/cache@v4
        with:
          path: web/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('web/package-lock.json') }}

      - name: Test
        run: npx vitest run
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      # The bundle the server actually serves must parse, not just the source.
      - name: Served bundle parses
        run: node --check dist/assets/*.js
        working-directory: web
