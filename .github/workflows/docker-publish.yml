name: Docker

# One job, one image: build on the architecture the image is for and push it. No matrix, no
# per-arch digest export, no manifest merge — with a single platform there is nothing to merge, and
# the merge job only existed to assemble a multi-arch index.
#
# arm64 only, on a native runner: no QEMU, no cross-compile in the build. The deployment is arm64;
# a second architecture would double every image version (manifest, attestations, layers).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The image version is the git tag (v0.27.0).
            type=ref,event=tag
            # Always-tag latest from the newest release.
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not `type=gha`: the Actions cache has a hard 10 GB repo-wide limit
          # shared with Swatinem/rust-cache, and the arm64 release dependency layer is big enough to
          # be evicted — every build then recompiles the world. A registry cache has no size limit;
          # its cost is storage, and `prune-packages.yml` keeps that in hand.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
