services:
  stock-predicter:
    # Published image (built only on a v* tag). Comment `image` and uncomment `build` to build
    # from this checkout instead.
    image: ghcr.io/manmohangurram/stock-predictor:latest
    # build: .
    container_name: stock-predicter
    restart: unless-stopped
    ports:
      # LAN only on purpose: there is no authentication. Never publish this to the internet.
      - "8080:8080"
    volumes:
      # The SQLite database, its WAL and the ledger live here. Back this up.
      - ./data:/data
    environment:
      RUST_LOG: "info"
      # The only configuration that lives here. Everything else — budget, limits, model and keys,
      # ntfy, polling cadence, the proxy — is a settings row edited on the Settings page.
      # PUBLIC_URL: "http://192.168.1.10:8080"   # deep link on notifications
      # DB_PATH: "/data/stock-predicter.db"      # the default; change only to relocate
