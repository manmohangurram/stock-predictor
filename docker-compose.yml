services:
  stock-predicter:
    image: ghcr.io/manmohangurram/stock-predictor:latest
    container_name: stock-predicter
    restart: unless-stopped
    environment:
      # The only configuration that lives here. Budget, limits, model and key, ntfy, cadence and
      # the proxy are settings rows edited on the Settings page.
      # BIND (0.0.0.0:8080) and DB_PATH (/data/stock-predicter.db) are set by the image already.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env — openssl rand -hex 32}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - proxy
    volumes:
      # The SQLite database, its WAL and (unless SECRET_KEY is set) secret.key live here. Back it up.
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 128m
    # No published ports on purpose: there is no authentication, so this is reachable only through
    # the proxy network. To try it on the LAN instead, add:  ports: ["8080:8080"]

networks:
  proxy:
    external: true
