# `cargo audit` reads this file. Every entry here is a decision with a reason, and a condition that
# ends it — not a way to make CI quiet.

[advisories]
ignore = [
  # RUSTSEC-2026-0459 — libsqlite3-sys 0.37.0 bundles a SQLite with CVE-2026-119375 (6.8 medium).
  # The patched bindings are 0.39; sqlx-sqlite 0.9.0 will not accept them (`cargo update -p
  # libsqlite3-sys --precise 0.39.1` is refused by sqlx-sqlite 0.9.0), so the fix lands with sqlx. The exploit needs a database or SQL the app did not write;
  # this app opens its own file, binds every parameter, and never executes SQL from a request.
  # End condition: sqlx allows libsqlite3-sys 0.39 — then upgrade and delete this ignore.
  "RUSTSEC-2026-0459",
]
