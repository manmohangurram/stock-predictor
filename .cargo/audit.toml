# `cargo audit` reads this file. Every entry here is a decision with a reason, and a condition that
# ends it — not a way to make CI quiet.

[advisories]
ignore = [
  # RUSTSEC-2026-0459 — libsqlite3-sys 0.30.1 bundles a SQLite with CVE-2026-119375 (6.8 medium).
  # The patched bindings are 0.39, but sqlx-sqlite 0.9.0 pins `libsqlite3-sys = 0.30`, so the fix
  # cannot be taken until sqlx releases. The exploit needs a database or SQL the app did not write;
  # this app opens its own file, binds every parameter, and never executes SQL from a request.
  # End condition: sqlx allows libsqlite3-sys 0.39 — then upgrade and delete this ignore.
  "RUSTSEC-2026-0459",
]
