[package]
name = "stock-predictor"
version = "0.29.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom"] }
chrono = "0.4"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2"
# Only what the code uses: runtime + #[tokio::main], TCP listener, timers, Mutex.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "hot_paths"
harness = false
